<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>教務系統登入驗證測試</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    animation: slideUp 1s ease-out 0.3s both;
    width: 100%;
    max-width: 500px;
    margin: 40px auto;

    }
    h2 {
      text-align: center;
      margin-top: 40px;
    }
    /* 調整 container 樣式以配合置中 */
    .card .container { 
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0; /* 移除 container 默認 padding */
    }
    /* 讓 input 區塊佔滿 card 的寬度 */
    .card .col-md-6 { 
      width: 100%; 
      max-width: 300px; /* 限制輸入框和按鈕一樣長 */
    }
    .btn-primary {
      display: block; /* 讓按鈕可以利用 margin: auto 置中 */
      margin-left: auto;
      margin-right: auto;
      margin-top: 20px; /* 增加與上方 input 的間距 */
    }
    /* 確保 Alert 框置中 */
    .alert-container {
        max-width: 500px;
        margin: 20px auto;
        text-align: center;
    }
  </style>
</head>
<body>
  <h2>教務系統帳密驗證測試</h2>
  <form id="loginForm" class="card">
  <div class="container">
    <input type="hidden" id="lineUserId" name="line_user_id" value="">
    <div class="col-md-6">
      <label class="form-label">學號</label>
      <input type="text" class="form-control mb-3" id="studentId" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">密碼</label>
      <input type="password" class="form-control mb-3" id="password" required>
    </div>
  </div>
  <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 300px;">
    <span id="buttonText">驗證登入</span>
    <span id="loadingContent" class="d-none">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        
    </span>
</button>
</form>

  <div class="alert-container">
      <div id="resultAlert" class="alert d-none" role="alert">
          </div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const buttonText = document.getElementById('buttonText');
    const loadingSpinner = document.getElementById('loadingContent');
    // 設置 Loading 狀態
    function setLoading(isLoading) {
        if (isLoading) {
            submitBtn.disabled = true;
            buttonText.textContent = '驗證中...';
            loadingSpinner.classList.remove('d-none');
        } else {
            submitBtn.disabled = false;
            buttonText.textContent = '驗證登入';
            loadingSpinner.classList.add('d-none');
        }
    }

    // --- 頁面載入時：讀取 URL 參數並填入隱藏欄位 ---
    // ... (這裡的 URL 參數獲取邏輯維持不變) ...
    const urlParams = new URLSearchParams(window.location.search);
    let targetParamsString = '';
    const liffState = urlParams.get('liff.state');

    if (liffState) {
        targetParamsString = decodeURIComponent(liffState);
    } else {
        targetParamsString = window.location.search;
    }

    const finalParams = new URLSearchParams(targetParamsString);
    const lineIdFromUrl = finalParams.get('line_user_id');
    const hiddenInput = document.getElementById('lineUserId');

    if (lineIdFromUrl && hiddenInput) {
        hiddenInput.value = lineIdFromUrl;
        console.log("LINE User ID 最終成功獲取:", lineIdFromUrl);
    } else {
        console.log("未找到 LINE User ID 參數。");
    }

    // --- 表單提交時：發送登入請求 ---
    document.getElementById('loginForm').onsubmit = async function(e) {
        e.preventDefault();

        // 獲取 Alert 元素
        const alertElement = document.getElementById('resultAlert');
        // 提交前先隱藏 Alert 避免視覺干擾
        alertElement.classList.add('d-none'); 

        const lineUserId = document.getElementById('lineUserId').value;
        const studentId = document.getElementById('studentId').value;
        const password = document.getElementById('password').value;

        // 清除 Alert 狀態的輔助函數
        function clearAlertClasses() {
             alertElement.classList.remove('alert-danger', 'alert-success', 'alert-warning');
        }

        // 檢查關鍵欄位是否為空 (自定義警告)
        if (!studentId || !password) {
             clearAlertClasses();
             alertElement.textContent = '學號和密碼不能為空。';
             alertElement.classList.add('alert-warning');
             alertElement.classList.remove('d-none');
             return;
        }
        if (!lineUserId) {
             clearAlertClasses();
             alertElement.textContent = 'LINE User ID 缺失，請確認導向連結。';
             alertElement.classList.add('alert-danger');
             alertElement.classList.remove('d-none');
             return;
        }
        setLoading(true); // 設置為 Loading 狀態

         // 發送登入請求到後端
        try {
            const response = await fetch('/verify_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lineUserId, studentId, password })
            });
            setLoading(false); // 停止 Loading 狀態
            const result = await response.json();
            // 根據後端返回的 success 狀態來決定 Alert 顏色
            clearAlertClasses();
            alertElement.textContent = result.message;
            if (result.success) {
                alertElement.classList.add('alert-success');
            } else {
                alertElement.classList.add('alert-danger'); // 登入失敗顯示紅色
            }
            alertElement.classList.remove('d-none'); // 顯示 Alert
        } catch (error) {
            console.error('Login request failed:', error);
            // 停止 Loading 狀態
            setLoading(false);
            clearAlertClasses();
            alertElement.textContent = '登入請求失敗，請檢查網路連接或伺服器。';
            alertElement.classList.add('alert-danger');
            alertElement.classList.remove('d-none');
        }
    };

  </script>
</body>
</html>
